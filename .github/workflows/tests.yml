name: CPU contract tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4 scipy==1.15.3 numba==0.61.2
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q occ_label_pipeline
